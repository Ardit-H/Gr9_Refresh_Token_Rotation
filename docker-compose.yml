services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # The project's own authentication service (static / naive / atomic /
  # grace strategies), backed by Redis.
  auth-service:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # Test harness: runs the security experiment and writes to ./results.
  # Only started on demand:
  #   docker compose run --rm harness                                   (main.yaml)
  #   docker compose run --rm harness experiments/configs/grace.yaml
  harness:
    build: .
    profiles: ["harness"]
    entrypoint: ["python", "experiments/run_main.py"]
    command: ["experiments/configs/main.yaml"]
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./results:/app/results
    depends_on:
      - redis

  # Local Keycloak instance used to compare the project's own strategies
  # against a real authorization server (Phase 4 validation target,
  # CVE-2026-1035). Version pinned via KEYCLOAK_VERSION in .env.
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.2.5}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./infra/docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  # Second real authorization server, compared against Keycloak and the
  # project's own strategies. Hydra has no admin UI and no password grant;
  # the harness drives the authorization-code + login/consent admin API
  # itself (see servers/hydra_client.py). SQLite keeps the setup to one
  # extra container; HYDRA_GRACE_PERIOD mirrors grace_rotation's window.
  hydra-sqlite:
    image: busybox
    volumes:
      - hydra-sqlite:/mnt/sqlite
    command: chmod -R 777 /mnt/sqlite

  hydra-migrate:
    image: oryd/hydra:${HYDRA_VERSION:-v26.2.0}
    environment:
      DSN: sqlite:///mnt/sqlite/db.sqlite?_fk=true&mode=rwc
    command: migrate -c /etc/config/hydra/hydra.yml sql up -e --yes
    volumes:
      - hydra-sqlite:/mnt/sqlite
      - ./infra/docker/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      hydra-sqlite:
        condition: service_completed_successfully

  hydra:
    image: oryd/hydra:${HYDRA_VERSION:-v26.2.0}
    environment:
      DSN: sqlite:///mnt/sqlite/db.sqlite?_fk=true&mode=rwc
      OAUTH2_GRANT_REFRESH_TOKEN_ROTATION_GRACE_PERIOD: ${HYDRA_GRACE_PERIOD:-0s}
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    ports:
      - "4444:4444" # public API (login/token)
      - "4445:4445" # admin API (client + consent management)
    volumes:
      - hydra-sqlite:/mnt/sqlite
      - ./infra/docker/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

volumes:
  hydra-sqlite:
